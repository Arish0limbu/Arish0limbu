<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Purple base glow -->
  <line x1="0" y1="6" x2="1200" y2="6" stroke="#8A2BE2" stroke-width="3" opacity="0.35" filter="url(#glow-lg)" stroke-dasharray="50 15 25 20 10 30" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-150" dur="3s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="6;5.5;6;6.5;6" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="6;5.5;6;6.5;6" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <!-- Green mid glow -->
  <line x1="0" y1="6" x2="1200" y2="6" stroke="#00FF41" stroke-width="2" opacity="0.45" filter="url(#glow)" stroke-dasharray="20 30 15 35" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-100" dur="1.6s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="6;6.5;6;5.5;6" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="6;6.5;6;5.5;6" dur="2.8s" repeatCount="indefinite"/>
  </line>

  <!-- Cyan data stream -->
  <line x1="0" y1="6" x2="1200" y2="6" stroke="#00E5FF" stroke-width="1.5" opacity="0.75" filter="url(#glow)" stroke-dasharray="8 22 5 18 12 35" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-100" dur="1.1s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="stroke-width" values="1;2;1" dur="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="6;5.8;6;6.2;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="6;5.8;6;6.2;6" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- White core -->
  <line x1="0" y1="6" x2="1200" y2="6" stroke="#ffffff" stroke-width="0.7" opacity="0.6" stroke-dasharray="4 20 8 28 6 34" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-100" dur="1.4s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="6;5.7;6;6.3;6" dur="1.7s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="6;5.7;6;6.3;6" dur="1.7s" repeatCount="indefinite"/>
  </line>

  <!-- Traveling pulse 1 -->
  <line x1="0" y1="6" x2="25" y2="6" stroke="#00E5FF" stroke-width="2.5" opacity="0" filter="url(#glow-lg)" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="-25,0; 1200,0" dur="2.2s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.85;0" dur="2.2s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.5 0 0.5 1; 0.5 0 0.5 1"/>
  </line>

  <!-- Traveling pulse 2 -->
  <line x1="0" y1="6" x2="20" y2="6" stroke="#00FF41" stroke-width="2" opacity="0" filter="url(#glow)" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="-20,0; 1200,0" dur="2.8s" begin="0.9s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="2.8s" begin="0.9s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.5 0 0.5 1; 0.5 0 0.5 1"/>
  </line>

  <!-- Traveling pulse 3 -->
  <line x1="0" y1="6" x2="30" y2="6" stroke="#8A2BE2" stroke-width="3" opacity="0" filter="url(#glow-lg)" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="-30,0; 1200,0" dur="3.5s" begin="1.8s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" begin="1.8s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.5 0 0.5 1; 0.5 0 0.5 1"/>
  </line>

  <!-- Glitch segment A -->
  <line x1="180" y1="6" x2="200" y2="6" stroke="#00FF41" stroke-width="1.8" opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1;0;0;0.6;0" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="6;5;6;7;6" dur="0.35s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="6;5;6;7;6" dur="0.35s" repeatCount="indefinite"/>
  </line>

  <!-- Glitch segment B -->
  <line x1="420" y1="6" x2="445" y2="6" stroke="#8A2BE2" stroke-width="2" opacity="0" filter="url(#glow-lg)">
    <animate attributeName="opacity" values="0;0;1;0;0.8;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="6;6.8;5.2;6" dur="0.28s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="6;6.8;5.2;6" dur="0.28s" repeatCount="indefinite"/>
  </line>

  <!-- Glitch segment C -->
  <line x1="680" y1="6" x2="695" y2="6" stroke="#00E5FF" stroke-width="1.6" opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0.8;0;1;0" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="6;5.2;6.8;6" dur="0.22s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="6;5.2;6.8;6" dur="0.22s" repeatCount="indefinite"/>
  </line>

  <!-- Glitch segment D -->
  <line x1="920" y1="6" x2="940" y2="6" stroke="#00FF41" stroke-width="1.5" opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0.7;0" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="6;4.8;7.2;6" dur="0.18s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="6;4.8;7.2;6" dur="0.18s" repeatCount="indefinite"/>
  </line>

  <!-- Glitch segment E -->
  <line x1="1050" y1="6" x2="1065" y2="6" stroke="#ffffff" stroke-width="1" opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="6;5.5;6.5;6" dur="0.25s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="6;5.5;6.5;6" dur="0.25s" repeatCount="indefinite"/>
  </line>
</svg>