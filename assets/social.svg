<svg viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#feda75"/>
      <stop offset="30%" stop-color="#fa7e1e"/>
      <stop offset="60%" stop-color="#d62976"/>
      <stop offset="100%" stop-color="#962fbf"/>
    </linearGradient>

    <style>
      <![CDATA[
      .box {
        fill: #0d1210;
        stroke-opacity: 0.5;
        transition: stroke-opacity 0.2s ease, transform 0.2s ease;
      }
      .icon-group {
        opacity: 0;
        animation: comeIn 0.5s ease-out forwards;
        cursor: pointer;
      }
      @keyframes comeIn {
        0%   { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      .icon-group:hover .box {
        stroke-opacity: 1;
        transform: translateY(-3px);
      }
      .box {
        animation: pulse 4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.75; }
      }
      ]]>
    </style>
  </defs>

