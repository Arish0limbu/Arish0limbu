name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run GitHub Stats Script
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXTRA_EMAILS: ${{ vars.EXTRA_EMAILS }}
        run: python python/status.py

      - name: Run stats2.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXTRA_EMAILS: ${{ vars.EXTRA_EMAILS }}
        run: python python/stats2.py

      - name: Run Commit Activity Graph
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python python/activity_graph.py

      - name: Run contribution shooter
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python python/contribution_shooter.py

      - name: Run achievement
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python python/achievement.py

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub profile stats"
          file_pattern: "assets/*.svg *.svg stats_cache.json stats2_cache.json"
