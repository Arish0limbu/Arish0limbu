name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Configure git for cloning
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run GitHub Stats Script
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          # Optional: comma-separated list of extra commit-author emails
          # (e.g. a work email) to include in the lines-of-code count.
          EXTRA_EMAILS: ${{ vars.EXTRA_EMAILS }}
        run: python python/status.py

      - name: Run stats2.py (stats.svg only)
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXTRA_EMAILS: ${{ vars.EXTRA_EMAILS }}
        run: python python/stats2.py

      - name: Run contribution_shooter.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python python/contribution_shooter.py

      - name: Run achievement.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python/python achievement.py

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub Stats"
          file_pattern: "*.svg stats_cache.json stats2_cache.json"
